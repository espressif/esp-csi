[platformio]
default_envs = unihiker_wifi_sensing

[env:unihiker_wifi_sensing]
platform = https://github.com/DFRobot/platform-unihiker.git#508e31875ad92205bf946e28570fb78fc01ceb2e
platform_packages =
    framework-arduinounihiker @ https://github.com/DFRobot/framework-arduinounihiker.git#9fabfd6d6324dbb304ad47947675baf7cf1ab29e
board = unihiker_k10
framework = arduino
board_build.arduino.upstream_packages = no
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DModel=None
    -Ilib/esp-radar/include
    -Wl,--wrap=esp_wifi_set_csi_rx_cb
extra_scripts =
    pre:scripts/link_radar.py
    post:scripts/log_compat.py
